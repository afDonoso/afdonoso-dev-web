<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Provisional. Neutral by design — the portfolio identity is deferred. -->
  <style>
    rect { fill: #fbfbfa; stroke: #d5d5d2; }
    text { fill: #17181a; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #121314; stroke: #2f3133; }
      text { fill: #ececea; }
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke-width="2"/>
  <text x="32" y="43" font-family="ui-sans-serif,-apple-system,Helvetica,sans-serif"
        font-size="34" font-weight="600" text-anchor="middle">a</text>
</svg>
